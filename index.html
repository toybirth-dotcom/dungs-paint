<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<title>덩 칠하기 공방</title>
<style>:root{--ink:#4a2f3a;--sub:#8b6b78;--card:#fffaf3;--pink:#ff6fa8;--sh:0 5px 0 rgba(120,70,90,.16),0 12px 24px rgba(120,70,90,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;
 background:radial-gradient(1200px 700px at 20% 10%,#fff7d6 0,transparent 60%),radial-gradient(900px 700px at 90% 90%,#d8ecff 0,transparent 60%),linear-gradient(160deg,#fff1e2,#ffe0ec 55%,#e4f1ff)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#stage.pick{cursor:crosshair}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 0;gap:8px;pointer-events:none;z-index:10}
.hud .grp{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;box-shadow:var(--sh);font-size:18px;white-space:nowrap;line-height:1.2}
.pill small{font-size:12px;color:var(--sub);margin-right:6px}
.hearts{letter-spacing:2px;color:#ff4f7d;font-size:20px}
.hearts .off{color:#e8d6dc}
.ib{pointer-events:auto;border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;min-width:40px;height:40px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.ib:active{transform:translateY(2px)}
#card{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(94vw,440px);display:grid;grid-template-columns:104px 1fr;gap:10px;background:var(--card);border-radius:22px;padding:10px;box-shadow:var(--sh);z-index:9;transition:opacity .2s,transform .3s}
#card.hide{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-20px)}
#miniwrap{position:relative;width:104px;height:104px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fff 0,#ffeedd 100%)}
#mini{width:104px;height:104px;display:block;transition:filter .25s}
#mini.veil{filter:blur(16px) saturate(.3)}
#miniq{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:44px;color:#c4a5b1}
#miniwrap.veil #miniq{display:flex}
#side{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
#flavor{font-size:15px;line-height:1.25;color:var(--sub);min-height:2.5em}
#flavor b{color:var(--ink);font-weight:400}
#chips{display:flex;gap:4px;justify-content:space-between}
.chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;font-size:11px;color:var(--sub)}
.chip b{font-weight:400}
.chip i{position:relative;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e9d8de,0 2px 4px rgba(0,0,0,.12);transition:box-shadow .2s,transform .2s}
.chip.clay i{border-style:dashed;border-color:#d9c3ba;background-clip:padding-box}
.chip.ok i{box-shadow:0 0 0 3px #3fcf5a,0 2px 6px rgba(63,207,90,.5);transform:scale(1.08)}
.chip.ok i::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.chip em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--ink)}
.chip.unk i{background:#e9dde1!important}
.chip.unk em{color:#bfa7b1}
#pat{height:10px;background:#f0e2e6;border-radius:99px;overflow:hidden;position:relative}
#pat i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#46d37a;transition:background .3s}
#peek{pointer-events:auto;display:none;margin-top:4px;align-self:flex-start;border:0;border-radius:99px;background:#ffe4ef;color:#c6416f;font:inherit;font-size:12px;padding:3px 10px;cursor:pointer}
#peek.on{display:inline-block}
#pal{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,620px);padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(120,70,90,.14);z-index:9;transition:transform .3s}
#pal.hide{transform:translateX(-50%) translateY(110%)}
#palinfo{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub);padding:0 6px 6px}
#palinfo b{font-weight:400;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
#palinfo b i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1.5px #d9c3ca}
#sw{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.sw{position:relative;width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e8d5dc,0 3px 6px rgba(0,0,0,.14);cursor:pointer;padding:0;transition:transform .12s}
.sw:active{transform:scale(.92)}
.sw.sel{transform:scale(1.16);box-shadow:0 0 0 4px var(--ink),0 4px 8px rgba(0,0,0,.2)}
.sw.new{animation:pop .7s 3}
.sw span{position:absolute;right:-3px;bottom:-5px;font-size:10px;background:var(--ink);color:#fff;border-radius:7px;padding:0 4px;line-height:14px}
@media (hover:none){.sw span{display:none}}
.sw.wash{background:linear-gradient(#f3fbff,#cfeeff)}
.sw.wash::before{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-6px 0 0 -7px;background:#4ab4f0;border-radius:50% 0 50% 50%;transform:rotate(-45deg)}
.sw.rnd{background:conic-gradient(#f0414f,#ffd21f,#3fcf5a,#2f7bf6,#9a62ff,#f0414f)}
.sw.cus{overflow:hidden;background:conic-gradient(#fff,#ccc,#fff)}
.sw.cus input{position:absolute;inset:-6px;width:60px;height:60px;opacity:0;cursor:pointer}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:44px;color:#fff;-webkit-text-stroke:7px #ff6fa8;paint-order:stroke fill;text-shadow:0 5px 0 rgba(120,50,80,.35);z-index:12;pointer-events:none;opacity:0;white-space:nowrap;text-align:center}
#toast small{display:block;font-size:22px;margin-top:4px}
#toast.show{animation:toast 1.4s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.fl{position:fixed;z-index:11;pointer-events:none;font-size:18px;color:#fff;background:rgba(74,47,58,.82);border-radius:99px;padding:2px 10px;white-space:nowrap;transform:translate(-50%,-50%);animation:fl .9s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-220%)}}
#tip{position:fixed;z-index:11;pointer-events:none;font-size:15px;color:#fff;background:rgba(74,47,58,.85);border-radius:10px;padding:2px 9px;transform:translate(14px,14px);display:none}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;background:rgba(255,245,238,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.on{display:flex}
#title{background:linear-gradient(180deg,rgba(255,246,236,.92) 0,rgba(255,246,236,.1) 38%,rgba(255,246,236,0) 55%,rgba(255,246,236,.9) 100%);backdrop-filter:none;-webkit-backdrop-filter:none;justify-content:space-between;padding:calc(6vh + env(safe-area-inset-top)) 20px calc(4vh + env(safe-area-inset-bottom))}
.logo{font-size:clamp(40px,9vw,72px);line-height:1;color:var(--ink);text-shadow:0 4px 0 #fff,0 8px 0 rgba(255,111,168,.35)}
.logo em{font-style:normal;color:var(--pink)}
.sub{font-size:clamp(15px,3.6vw,20px);color:var(--sub);margin-top:10px}
.big{border:0;border-radius:999px;font:inherit;font-size:24px;padding:14px 38px;color:#fff;background:var(--pink);box-shadow:0 6px 0 #d94882,0 14px 24px rgba(217,72,130,.3);cursor:pointer;min-width:220px}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #d94882}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 #e3d0d7,0 14px 24px rgba(120,70,90,.12);font-size:19px;padding:11px 30px;min-width:220px}
.big[disabled]{opacity:.55;cursor:wait}
.how{font-size:14px;color:var(--sub);line-height:1.55;background:rgba(255,250,243,.85);border-radius:16px;padding:8px 16px;max-width:420px}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.stat{font-size:15px;color:var(--sub)}
.stat b{color:var(--ink);font-weight:400;font-size:20px}
.res{font-size:68px;line-height:1;color:var(--pink);text-shadow:0 4px 0 #fff}
.ov h2{margin:0;font-size:40px;font-weight:400}
#snap img{max-width:min(80vw,420px);max-height:48vh;border-radius:18px;background:repeating-conic-gradient(#f1e6ea 0 25%,#fff 0 50%) 0 0/20px 20px;box-shadow:var(--sh)}
#snap a{text-decoration:none;display:inline-block}
.tools{position:fixed;right:12px;top:calc(60px + env(safe-area-inset-top));display:none;flex-direction:column;gap:8px;z-index:9}
.tools.on{display:flex}
@media (max-width:520px){.pill{font-size:16px;padding:5px 11px}.pill small{margin-right:4px}.hud{padding-left:8px;padding-right:8px}.hud .grp{gap:6px}.ib{min-width:36px;height:36px;padding:0 10px}}
.share{width:min(92vw,360px);display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,250,243,.92);border-radius:16px;padding:10px 12px 12px;box-shadow:var(--sh)}
.share[hidden],.share [hidden]{display:none!important}
.share p{margin:0;font-size:15px;line-height:1.45;color:var(--ink)}
.share b{font-weight:400;color:var(--pink)}
.share .msg{font-size:14px;color:var(--sub)}
.share .srow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sbtn{border:0;border-radius:999px;font:inherit;font-size:16px;padding:9px 18px;cursor:pointer}
.sbtn:active{transform:translateY(2px)}
.sbtn[disabled]{opacity:.6;cursor:wait}
.sbtn.kakao{background:#fee500;color:#191919;box-shadow:0 4px 0 #d9c200}
.sbtn.no{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e3d0d7}
.share input{width:100%;font:inherit;font-size:13px;padding:7px 9px;border-radius:10px;border:1px solid #e3d0d7;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
</style><meta property="og:title" content="덩 칠하기 공방">
<meta property="og:description" content="손님이 주문한 색대로 덩을 칠해 주세요!">
<meta property="og:type" content="website">
</head><body>

<canvas id="stage"></canvas>
<canvas id="fx"></canvas>
<div class="hud" id="hud" style="display:none">
 <div class="grp"><div class="pill"><small>점수</small><span id="score">0</span></div><div class="pill" id="ordpill"><small>손님</small><span id="ordn">1</span></div></div>
 <div class="grp"><div class="pill hearts" id="hearts"></div><button class="ib" id="bsnd" aria-label="소리">♪</button><button class="ib" id="bpause" aria-label="일시정지">Ⅱ</button></div>
</div>
<div id="card" class="hide">
 <div id="miniwrap"><canvas id="mini" width="208" height="208"></canvas><div id="miniq">?</div></div>
 <div id="side"><div id="flavor"></div><div><div id="chips"></div><div id="pat" style="margin-top:6px"><i style="width:100%"></i></div><button id="peek">다시 보기 (-3초)</button></div></div>
</div>
<div class="tools" id="tools">
 <button class="ib" id="tbrush">붓 크기: 보통</button><button class="ib" id="tsnap">사진 저장</button><button class="ib" id="treset">처음 색으로</button><button class="ib" id="tback">나가기</button>
</div>
<div id="pal" class="hide"><div id="palinfo"><span id="phint">색을 고르고 덩을 탭!</span><b id="psel"><i></i><span></span></b></div><div id="sw"></div></div>
<div id="toast"></div><div id="tip"></div>
<div class="ov on" id="title">
 <div><div class="logo">덩 <em>칠하기</em> 공방</div><div class="sub">손님이 주문한 색대로 덩을 칠해 주세요!</div></div>
 <div class="btns"><div class="how">① 아래에서 물감을 고르고 ② 덩의 구획(머리·튜브·몸통·코)을 탭!<br>끌어서 돌려 볼 수도 있어요. 칠을 잘못했다면 물방울로 씻어내요.</div>
 <button class="big" id="bstart" disabled>불러오는 중…</button><button class="big alt" id="bfree" disabled>그냥 칠하기</button><div class="stat">최고 기록 <b id="best">0</b>점</div></div>
</div>
<div class="ov" id="pause"><h2>잠깐 쉬는 중</h2><div class="btns"><button class="big" id="bresume">계속하기</button><button class="big alt" id="bquit">타이틀로</button></div></div>
<div class="ov" id="over"><h2>영업 종료!</h2><div class="res" id="rscore">0</div><div class="stat" id="rinfo"></div><div class="share" id="sharePrompt" hidden>
  <p id="shareAsk">내 점수 <b><span id="shareScore">0</span>점</b>, 카카오톡으로 친구에게 링크를 보낼까요?</p>
  <div class="srow" id="shareBtns"><button class="sbtn kakao" id="shareYes" type="button">카카오톡으로 보내기</button><button class="sbtn no" id="shareNo" type="button">괜찮아요</button></div>
  <p class="msg" id="shareMsg" hidden></p>
  <input id="shareLink" type="text" readonly hidden aria-label="공유 문구">
 </div>
 <div class="btns"><button class="big" id="bretry">다시 영업하기</button><button class="big alt" id="bhome">타이틀로</button></div></div>
<div class="ov" id="snap"><h2>내 덩 완성!</h2><img id="snapimg" alt="내가 칠한 덩"><div class="stat">이미지를 길게 누르거나 우클릭으로 저장하세요</div><div class="btns"><a id="snapdl" download="my-dungs.png"><span class="big">PNG 내려받기</span></a><button class="big alt" id="snapclose">닫기</button></div></div>

function layoutFit(){

 if(S.mode==='play'){topH=$('card').getBoundingClientRect().bottom+4}

 if(S.mode==='title'){topH=H*0.2;botH=H*0.4}
 var freeH=Math.max(120,H-topH-botH);
 var r=Math.max(M?M.sph.radius*1.1:2,2.15),rH=Math.max(M?M.sph.radius*1.05:1.8,1.85);
 var tf=Math.tan(cam.fov*Math.PI/360);

 var c=M?M.sph.center.clone():new THREE.Vector3(0,1.3,0);c.y-=0.2;
 var shiftPx=(topH-botH)/2,shiftW=shiftPx/H*2*d*tf;
 var el=0.3;

 cam.lookAt(c.x,c.y+shiftW,c.z);

 /* mini */

 mini.setPixelRatio(dpr);mini.setSize(mw,mw,false);
 mcam.aspect=1;var mr=(M?M.sph.radius:1.9)*1.08,md=mr/Math.tan(mcam.fov*Math.PI/360);

  p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;var a=1-Math.pow(p.l/p.life,2);fc.globalAlpha=clamp(a,0,1);fc.fillStyle=p.c;

$('tback').onclick=toTitle;
$('tsnap').onclick=snapshot;$('snapclose').onclick=function(){$('snap').classList.remove('on')};
function snapshot(){
 var pv=pedestal.visible,tv=turntable.visible;pedestal.visible=false;turntable.visible=false;
 var oldShadow=key.castShadow;
 flushVC();renderer.render(scene,cam);var url=renderer.domElement.toDataURL('image/png');
 pedestal.visible=pv;turntable.visible=tv;
 $('snapimg').src=url;$('snapdl').href=url;$('snap').classList.add('on');sfxOk();
}
window.addEventListener('resize',layoutFit);
document.addEventListener('visibilitychange',function(){if(document.hidden&&S.mode==='play')pauseGame()});

/* ---------- main loop ---------- */
var demoT=0,last=performance.now(),tickAcc=0;
function frame(now){
 requestAnimationFrame(frame);
 var dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
 if(M){
  if(S.mode==='title'){demoT+=dt;if(demoT>0.85){demoT=0;var r=pick1(PREG),c=pick1(PAL);if(paintRegion(r.id,c.hex,M.parts[r.id].ctr))squashImpulse(-3.5)}}
  if(S.mode==='play'&&S.phase==='order'){
   S.t+=dt;var rem=remaining();
   if(S.order.hidden&&!S.hidden&&S.t>=5){S.hidden=true;renderOrderUI();refreshChips()}
   if(S.hidden&&S.peekUntil&&performance.now()>S.peekUntil&&S.peekUntil>0){S.peekUntil=0;renderOrderUI()}
   var pct=clamp(rem/S.order.T,0,1),bar=$('pat').firstChild;bar.style.width=(pct*100)+'%';bar.style.background=pct>0.5?'#46d37a':pct>0.25?'#ffb23f':'#ff4f6d';
   var sec=Math.ceil(rem);if(rem<5&&sec!==S.ticked){S.ticked=sec;sfxTick()}
   if(rem<=0)failOrder();
  }
  updateRegions(dt);updateModel(dt);flushVC();
  renderer.render(scene,cam);
  if(S.mode==='play'||S.mode==='pause'){
   mini.render(mscene,mcam);
  }
 }
 drawFx(dt);
}

/* ---------- boot ---------- */
function b64ToBuf(b64){var bin=atob(b64),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function boot(){
 buildChips();$('best').textContent=getBest();
 try{
  new THREE.GLTFLoader().parse(b64ToBuf(window.__GLB__),'',function(g){
   try{setupModel(g)}catch(err){console.error(err);$('bstart').textContent='모델을 읽지 못했어요';return}
   setDefaults();layoutFit();
   $('bstart').disabled=false;$('bstart').textContent='주문 받기';$('bfree').disabled=false;
   last=performance.now();requestAnimationFrame(frame);
   buildPalette(12,true);
  },function(err){console.error(err);$('bstart').textContent='모델을 읽지 못했어요'});
 }catch(e){console.error(e);$('bstart').textContent='3D 엔진을 불러오지 못했어요'}
 window.addEventListener('keydown',function(){},{passive:true});
}
window.__dp={S:S,get M(){return M},REG:REG,PAL:PAL,pickAt:pickAt,paintRegion:paintRegion,doPaint:doPaint,
 scan:function(){var out={};for(var y=40;y<window.innerHeight-40;y+=6)for(var x=20;x<window.innerWidth-20;x+=6){var h=pickAt(x,y);if(h&&!out[h.rid])out[h.rid]=[x,y]}return out},
 forceHide:function(){S.hidden=true;renderOrderUI()},complete:function(){var o=S.order;PREG.forEach(function(r){paintRegion(r.id,o.target[r.id],null)});checkMatch()},fail:function(){S.t=999}};
boot();
})();
